<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiro Programa em JavaScript</title>
    <style>
        body{
            /*Comentário em CSS*/
            background-color: rgb(106, 134, 226);
            color: white;
            font: normal 20pt Arial;
        }
        h1{
            color: aqua;
        }
    </style>

</head>
<body>
    <!--Comentário em HTML-->
    <h1>Olá, Mundo!</h1>
    <p>Me livrei da maldição</p>
    
    <script>
        /*Comentário em JS(também serve só // */
        // Espaço pra escrever 
        var nome = window.prompt("Qual é seu nome?")
        window.alert('É um grande prazer em te conhecer, ' + nome + "! ") // Concatenação

    </script>

</body>
</html>
