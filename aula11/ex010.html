 <!DOCTYPE html>
 <html lang="pt-BR">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DETRAN</title>
 </head>
 <body>
    <h1>Sistema de multas</h1>
    Velocidade do carro: <input type="number" name="txtvel" id="txtvel">Km/h 
    <input type="button" value="Verificar" onclick="calcular()">

   <div id="res"></div>

    <script>
      function calcular(){
         var txtv = document.getElementById('txtvel') //ou document.querySelector('input#txtvel')
         var res = document.getElementById('res') // ou document.querySelector('div#res')
         var vel = Number(txtv.value) 
         res.innerHTML = `<p>Sua velocidade atual é de <strong>${vel}</strong>Km/h.</p>`

         res.innerHTML += `<p>Dirija sempre com cinto de segurança</p>`
         if (vel > 70.5){
            res.innerHTML += '<p>Você ultrapassou a velocidade máxima! <strong>MULTADO</strong></p>'
         }/* else{
            res.innerHTML += '<p>Tá certinho</p>'
         }*/
      }
      
    </script>
 </body>
 </html>
